name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/ledger/**"      # the hourly capture must not re-trigger CI
      - "data/raw/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Types
        run: mypy src/

      - name: Tests
        run: pytest -q

      # I1 is the invariant that silently invalidates every downstream number,
      # so it gets its own named CI step — a green "Tests" line above can
      # never quietly stand in for it, and this step fails loudly on its own
      # if the leakage test is ever skipped or weakened (CLAUDE.md I1).
      - name: Leakage test (I1)
        run: pytest tests/test_no_leakage.py -v
