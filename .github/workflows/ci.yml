name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/ledger/**"      # the hourly capture must not re-trigger CI
      - "data/raw/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # `pip install -e ".[dev]"` alone left mypy checking src/ against a
      # dependency set with no fastapi/torch/scikit-learn/etc. installed —
      # locally green (they're all installed on every dev machine that's
      # touched this repo) and CI-red on the exact same commit, four times
      # in one day. `serving/api.py` (fastapi) and `models/{gbdt,forest,
      # deep,...}.py` (models extra) are real deliverables (D10, D6/D12);
      # mypy should genuinely check them, not skip them because the module
      # is missing.
      #
      # torch is installed separately, pinned to the exact version
      # pyproject.toml declares (ADR-019), from PyTorch's CPU-only wheel
      # index — the default PyPI index's torch wheel bundles CUDA and is
      # ~800MB; the CPU-only build mypy actually needs real types from is
      # ~180MB. This is what gives CI and a local dev venv *identical* mypy
      # coverage of aqi/models/deep.py's nn.Module subclass, rather than
      # silently exempting it in one environment and not the other.
      #
      # shap here is pinned to 0.46.0, NOT pyproject.toml's 0.52.0
      # (ADR-028) — that bump exists only to work around one Windows/
      # Python-3.13 dev machine having no MSVC toolchain to build shap
      # from source. 0.52.0 has no prebuilt wheel at all for cp311
      # (PyPI's file list starts at cp312-abi3), so on this job's Python
      # 3.11 it would silently fall back to a slow, fragile sdist build
      # instead of installing cleanly. 0.46.0 has a real manylinux cp311
      # wheel. This does not reintroduce the divergence this workflow
      # exists to close: `shap.*` is in pyproject.toml's
      # ignore_missing_imports override, so mypy never inspects shap's
      # internals in either environment either way — only its
      # presence/absence matters to mypy, and both versions are
      # genuinely present here and in local dev.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"
          pip install scikit-learn==1.6.0 lightgbm==4.5.0 statsmodels==0.14.4 shap==0.46.0 mapie==1.0.1
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Types
        run: mypy src/

      - name: Tests
        run: pytest -q

      # I1 is the invariant that silently invalidates every downstream number,
      # so it gets its own named CI step — a green "Tests" line above can
      # never quietly stand in for it, and this step fails loudly on its own
      # if the leakage test is ever skipped or weakened (CLAUDE.md I1).
      - name: Leakage test (I1)
        run: pytest tests/test_no_leakage.py -v
