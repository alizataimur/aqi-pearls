# D9/D10's missing piece (CLAUDE.md §13). Loads the serving model, predicts
# D+1/D+2/D+3 for both zones, WRITES THE FORECAST LEDGER AT ISSUE TIME (I3),
# and publishes reports/dashboard_snapshot.json — confirmed to never have
# existed before this session (grep for "inference_pipeline"/"inference-
# pipeline" across the whole repo matched only CLAUDE.md itself; data/ledger/
# held only observed/ and aqicn/, clock-starter's captures, with no third
# stream for our own issued forecasts). Every hour this doesn't run is a
# permanent gap in this project's own half of the benchmark (I3) — the same
# class of loss clock-starter.yml exists to prevent on the AQICN side.
#
# Mirrors feature-pipeline.yml/training-pipeline.yml/alerts.yml's shape
# (concurrency group, rebase-retry commit, Telegram+issue failure reporting)
# as the fifth workflow committing to main.

name: inference-pipeline

on:
  schedule:
    - cron: "45 * * * *"    # hourly; :45 avoids clock-starter's :07,
                             # feature-pipeline's :22, alerts' :37 and
                             # training-pipeline's daily 03:15
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: inference-pipeline
  cancel-in-progress: false   # never cancel mid-write — a half-written
                               # ledger append or a partial snapshot write
                               # is worse than a slow one

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same divergence class ci.yml/alerts.yml/training-pipeline.yml each
      # hit once: bare `pip install -e .` omits the `models` extra this
      # pipeline needs (joblib to unpickle the registered LightGBM artifact,
      # scikit-learn because LGBMRegressor's wrapper depends on it, lightgbm
      # itself) and `shap`, which render_static_snapshot.py's build_snapshot
      # needs for the explain block. Pinned to the same cp311-compatible
      # version ci.yml uses (0.46.0, not pyproject.toml's 0.52.0 — see
      # ADR-028) since this runner is Python 3.11 same as CI.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install joblib scikit-learn==1.6.0 lightgbm==4.5.0 shap==0.46.0

      - name: Predict, write the ledger, publish the snapshot
        env:
          FEATURE_STORE_BACKEND: ${{ secrets.FEATURE_STORE_BACKEND || 'parquet' }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.inference_pipeline

      - name: Commit the ledger and the snapshot
        # data/ledger/ is already un-ignored in full (.gitignore: the
        # ledger is committed, I3 — "losing it is unrecoverable"), so the
        # new predicted/ stream needs no allowlist change. Same
        # nothing-to-commit guard every other workflow here uses: a
        # snapshot that comes out byte-identical (no new feature-store hour
        # since the last run) must not fail the job on "nothing to commit".
        run: |
          git config user.name  "inference-pipeline[bot]"
          git config user.email "inference-pipeline@users.noreply.github.com"
          git add data/ledger reports/dashboard_snapshot.json
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(inference): hourly forecast $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="inference-pipeline FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > /dev/null || true
          fi

      - name: Open or update a tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "inference-pipeline is failing";
            const body = `The hourly inference-pipeline workflow failed: ` +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `I3 is being silently violated while this stays red — our own issued forecasts are not being recorded (CLAUDE.md §13).`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "inference-pipeline"],
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline-failure", "inference-pipeline"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }

      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "inference-pipeline"],
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
