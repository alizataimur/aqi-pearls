# D1's hourly workflow (CLAUDE.md §13). Fetches, builds and stores features
# for both forecast zones (ADR-013). Mirrors clock-starter.yml's shape —
# per-zone isolation, commit-and-rebase-retry, failure reporting — because
# it is the same class of "must not silently go dark" job, just one layer up
# the architecture (§7): clock-starter feeds the ledger, this feeds the store.

name: feature-pipeline

on:
  schedule:
    - cron: "22 * * * *"    # hourly; :22 to avoid clock-starter's :07 and the
                             # top-of-hour queue (CLAUDE.md §13)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feature-pipeline
  cancel-in-progress: false   # never cancel mid-write — a partial parquet
                               # write left mid-flight is worse than a slow one

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch, build features, upsert to the feature store
        env:
          FEATURE_STORE_BACKEND: ${{ secrets.FEATURE_STORE_BACKEND || 'parquet' }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.feature_pipeline

      - name: Commit the feature store
        # ADR-014: the parquet fallback commits inside the repo until an
        # HF_TOKEN + dataset repo exist. No-op once FEATURE_STORE_BACKEND
        # is hopsworks (nothing under data/feature_store/ changes).
        run: |
          git config user.name  "feature-pipeline[bot]"
          git config user.email "feature-pipeline@users.noreply.github.com"
          git add data/feature_store
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(features): hourly upsert $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="feature-pipeline FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > /dev/null || true
          fi

      - name: Open or update a tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "feature-pipeline is failing";
            const body = `The hourly feature-pipeline workflow failed: ` +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `D1's evidence bar is a green hourly run; this is a build-breaking gap until closed (CLAUDE.md §13).`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "feature-pipeline"],
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline-failure", "feature-pipeline"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }

      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "feature-pipeline"],
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
