# Day 0 workflow — CLAUDE.md §6. The first workflow that exists, and the one
# whose failure is least recoverable: a missed hour is a permanent gap in the
# benchmark that no amount of later effort can fill.
#
# Runs hourly, not daily. AQICN publishes no observation history, so a
# once-a-day snapshot cannot reconstruct a daily maximum — and daily max is the
# primary target (§9.1). See docs/DECISIONS.md ADR-002.

name: clock-starter

on:
  schedule:
    - cron: "7 * * * *"     # hourly; :07 to sit off the busy top-of-hour queue
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock-starter
  cancel-in-progress: false   # never cancel a capture — the hour is unrepeatable

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture AQICN observation + published forecast
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: python scripts/clock_starter.py

      - name: Commit the ledger
        run: |
          git config user.name  "clock-starter[bot]"
          git config user.email "clock-starter@users.noreply.github.com"
          git add data/ledger data/raw
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(ledger): capture $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another hourly run may have landed first; rebase rather than fail.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # A silently dead capture for a week destroys the benchmark claim.
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="clock-starter FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > /dev/null || true
          fi
