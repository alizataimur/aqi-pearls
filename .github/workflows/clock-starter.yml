# Day 0 workflow — CLAUDE.md §6. The first workflow that exists, and the one
# whose failure is least recoverable: a missed hour is a permanent gap in the
# benchmark that no amount of later effort can fill.
#
# Runs hourly, not daily. AQICN publishes no observation history, so a
# once-a-day snapshot cannot reconstruct a daily maximum — and daily max is the
# primary target (§9.1). See docs/DECISIONS.md ADR-002.

name: clock-starter

on:
  schedule:
    - cron: "7 * * * *"     # hourly; :07 to sit off the busy top-of-hour queue
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: clock-starter
  cancel-in-progress: false   # never cancel a capture — the hour is unrepeatable

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture AQICN observation + published forecast
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: python scripts/clock_starter.py

      - name: Commit the ledger
        run: |
          git config user.name  "clock-starter[bot]"
          git config user.email "clock-starter@users.noreply.github.com"
          git add data/ledger data/raw
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(ledger): capture $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another hourly run may have landed first; rebase rather than fail.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Report failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # A silently dead capture for a week destroys the benchmark claim.
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="clock-starter FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > /dev/null || true
          fi

      # The commit that added `issues: write` above (484b1ef) never actually
      # added these two steps — the message claimed "open a GitHub issue on
      # failure, close it on recovery" but only the permission landed. Fixed
      # here rather than left claiming automation that doesn't exist (I5's
      # spirit applied to workflow claims, not just report numbers).
      - name: Open or update a tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "clock-starter is failing";
            const body = `The hourly clock-starter workflow failed: ` +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Every missed hour is a permanent, unrecoverable ledger gap (CLAUDE.md §6, I3).`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "clock-starter"],
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline-failure", "clock-starter"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }

      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["pipeline-failure", "clock-starter"],
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
