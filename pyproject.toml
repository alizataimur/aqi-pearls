[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "Honest, uncertainty-aware 3-day AQI forecasting for Pakistani cities"
requires-python = ">=3.11"

# Stage 0 runs on the standard library alone — the clock starter must never be
# blocked by a dependency resolution problem (CLAUDE.md §6). Everything below
# is for later stages and is pinned, per §16.
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "pyyaml==6.0.2",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "requests==2.32.3",
  "structlog==24.4.0",
  # Parquet is the store's fallback backend (CLAUDE.md §11.1) and must work
  # for every pipeline from session 3 onward, so it's a base dependency
  # rather than behind the `data` extra CI doesn't install.
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
# Stage 2 — data + store. Not installed in CI (ci.yml) — none of it is
# needed to run or test ParquetFeatureStore. `hopsworks` bumped from the
# original 4.1.5 pin: that release requires Python <3.13, and this dev venv
# runs 3.13 (same class of problem as the torch/shap pins, ADR-019/028).
# 4.8.5 is the newest 4.x release (avoids the 5.x major line's unverified
# API surface), ships requires_python <3.14,>=3.9, and is a pure `py3-none`
# wheel — no native build. Now connected and verified against a live
# project (ADR-034).
data = [
  "pandera==0.22.1",
  "duckdb==1.1.3",
  "hopsworks==4.8.5",
]
# Stage 3 — models and evaluation
models = [
  "scikit-learn==1.6.0",
  "lightgbm==4.5.0",
  "statsmodels==0.14.4",
  # 2.5.1 (the original pin) has no wheel for the Python 3.13 interpreter
  # this repo's venv actually runs (pyproject says >=3.11, the venv is 3.13)
  # - bumped to the oldest 3.13-compatible release at session-5 time; see
  # docs/DECISIONS.md.
  "torch==2.7.1",
  # 0.46.0 (the original pin) has no prebuilt wheel for cp313 and needs an
  # MSVC C++ toolchain to build its native extension from source, which this
  # environment doesn't have — same class of problem as the torch pin above.
  # 0.52.0 ships a cp312-abi3 wheel (forward-compatible with 3.13). See
  # docs/DECISIONS.md.
  "shap==0.52.0",
  # I0 version trap (CLAUDE.md §12.5): the time-series class was
  # MapieTimeSeriesRegressor in 0.x and is mapie.regression.TimeSeriesRegressor
  # in 1.x. This pin selects the 1.x import. Do not copy a 0.x tutorial.
  "mapie==1.0.1",
]
# Stage 4 — serving
serve = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "streamlit==1.41.1",
  "plotly==5.24.1",
]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "pandas-stubs==2.2.3.241126",
  "httpx==0.28.1",  # FastAPI's TestClient (tests/test_api.py) needs it explicitly
  "types-requests==2.32.0.20241016",  # alerts/telegram.py is the first module to type-check `requests`
]
# Session 4 — EDA / physics-validation / divergence notebooks. statsmodels is
# already pinned under `models` (session 5 needs it for SARIMAX); repeated
# here isn't a version drift risk since both pins are identical.
notebooks = [
  "matplotlib==3.9.4",
  "statsmodels==0.14.4",
  "nbformat==5.10.4",
  "nbclient==0.10.1",
  "ipykernel==6.29.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Streamlit Cloud only installs requirements.txt, not this repo itself, so
# src/ must be put on sys.path before any `aqi.*` import — see the comment
# in app/streamlit_app.py. That import ordering is intentional, not an
# oversight, so E402 is silenced for this file only.
"app/streamlit_app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
# Notebooks import from src, never the reverse (CLAUDE.md §16).
exclude = ["notebooks/", "^build/"]

[[tool.mypy.overrides]]
module = [
  "yaml.*",
  "shap.*",
  "mapie.*",
  "lightgbm.*",
  "statsmodels.*",
  "hopsworks.*",
  "joblib.*",
  "sklearn.*",
  "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
