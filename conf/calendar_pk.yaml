# Festival calendar for the backfill range and a few years past submission.
#
# Islamic dates (Eid al-Fitr, Eid al-Adha) shift ~11 days a year and are
# moon-sighting dependent — the dates below are the commonly published
# Gregorian-calendar approximations (+/- 1 day is normal, and Pakistan's
# sighting sometimes lags Saudi Arabia's by a day). Good enough for a
# firecracker/traffic-spike flag; verify against Pakistan's official Ruet-e-
# Hilal Committee announcements before the final report if the day-level
# precision starts mattering to a specific finding.
#
# Diwali is Hindu-lunisolar, not Islamic — included per CLAUDE.md §10 for
# regional firecracker-driven spikes. New Year is fixed and could be computed,
# but is listed for uniformity so every festival_flag source is one lookup.

festivals:
